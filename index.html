<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Clinical</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="canonical" href="crm.html">
<script>
  /* Redirige a crm.html preservando ?query y #hash (crítico para
     los enlaces de Supabase: recuperar contraseña, confirmar
     correo). Además agrega un parámetro de caché ("v") para que
     el navegador no sirva una copia vieja de crm.html guardada
     de una visita anterior. */
  var search = window.location.search;
  var version = "v=" + Date.now();
  var joined = search ? (search + "&" + version) : ("?" + version);
  var target = "crm.html" + joined + window.location.hash;
  window.location.replace(target);
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#FAFAF8; color:#64748B; }
  a { color:#0F766E; }
</style>
</head>
<body>
  <p>Cargando Nexus Clinical… si no avanza automáticamente, <a href="crm.html" id="fallback-link">haz clic aquí</a>.</p>
  <script>
    document.getElementById("fallback-link").href = "crm.html" + window.location.search + window.location.hash;
  </script>
</body>
</html>
