<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Clinical</title>
<link rel="canonical" href="crm.html">
<script>
  /* Redirige a crm.html preservando ?query y #hash. Es crítico
     para los enlaces de Supabase (recuperar contraseña, confirmar
     correo): si se descartara ese código en el salto, el enlace
     llegaría "vacío" y el flujo de recuperación nunca se activaría
     en crm.html. */
  var target = "crm.html" + window.location.search + window.location.hash;
  window.location.replace(target);
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#FAFAF8; color:#64748B; }
  a { color:#0F766E; }
</style>
</head>
<body>
  <p>Cargando Nexus Clinical… si no avanza automáticamente, <a href="crm.html" id="fallback-link">haz clic aquí</a>.</p>
  <script>
    document.getElementById("fallback-link").href = "crm.html" + window.location.search + window.location.hash;
  </script>
</body>
</html>
